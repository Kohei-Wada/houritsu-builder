[project]
name = "houritsu-builder"
version = "0.1.0"
description = "Builds the houritsu repository: Japanese laws as git history from the e-Gov law API"
requires-python = ">=3.12"
dependencies = [
    "rumdl==0.2.79",
]

[project.scripts]
houritsu-builder = "houritsu_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houritsu_builder"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
