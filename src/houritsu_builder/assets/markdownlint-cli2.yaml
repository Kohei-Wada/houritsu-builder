config:
  default: true
  MD009: false          # lone U+3000 table cells are statute text; markdownlint treats U+3000 as whitespace
  MD012: false          # same: a lone U+3000 line counts as blank
  MD013: false          # statute sentences are long by nature
  MD024: false          # every 附則 has the same heading
  MD025:
    front_matter_title: ""   # frontmatter title is metadata, the H1 is the law title
  MD026: false          # captions may end in full-width punctuation
  MD033:
    allowed_elements: [ruby, rt, sup, sub]
globs:
  - "laws/**/*.md"
